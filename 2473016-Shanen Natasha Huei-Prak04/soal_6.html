<html lang="en">

<head>

    <title>Styling Table-2473016</title>
    <style>
        table {
            border-collapse: collapse;
            width: 70%;
        }

        th,
        td {
            border: 1px solid #98bf21;
            padding: 4px;
        }

        th {
            background: #A7C942;
            color: white;
            text-align: left;
        }

        /* pola warna tabel */
        tr:nth-child(odd) td:nth-child(odd) {
            background: #d7eb8a;
        }

        tr:nth-child(odd) td:nth-child(even) {
            background: #feffb2;
        }

        tr:nth-child(even) td:nth-child(odd) {
            background: #feffb2;
        }

        tr:nth-child(even) td:nth-child(even) {
            background: #d7eb8a;
        }
    </style>
</head>

<body>

    <table>

        <tr>
            <th>Company</th>
            <th>Contact</th>
            <th>Country</th>
        </tr>

        <tr class="row1">
            <td>Alfreds Futterkiste</td>
            <td>Maria Anders</td>
            <td>Germany</td>
        </tr>

        <tr class="row2">
            <td>Berglunds snabbköp</td>
            <td>Christina Berglund</td>
            <td>Sweden</td>
        </tr>

        <tr class="row1">
            <td>Centro comercial Moctezuma</td>
            <td>Francisco Chang</td>
            <td>Mexico</td>
        </tr>

        <tr class="row2">
            <td>Ernst Handel</td>
            <td>Roland Mendel</td>
            <td>Austria</td>
        </tr>

        <tr class="row1">
            <td>Island Trading</td>
            <td>Helen Bennett</td>
            <td>UK</td>
        </tr>

    </table>
</body>

</html>
