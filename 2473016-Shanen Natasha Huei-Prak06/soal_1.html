<!DOCTYPE html>
<html>

<head>
    <title>Aritmatika-2473016</title>
    <style>
        td {
            font-size: 30px;
            text-align: center;
        }
    </style>

    <script type="text/javascript">
        function count() {
            var a = document.getElementById("1number").value;
            var b = document.getElementById("2number").value;

            if (isNaN(a) && isNaN(b)) {
                alert("Angka pertama dan kedua harus angka");
                return;
            }

            else if (isNaN(a)) {
                alert("Angka pertama bukan angka");
                return;
            }

            else if (isNaN(b)) {
                alert("Angka kedua harus angka");
                return;
            }

            var num1 = parseInt(a);
            var num2 = parseInt(b);

            var plus = num1 + num2;
            var minus = num1 - num2;

            document.getElementById("a1").innerHTML = num1;
            document.getElementById("b1").innerHTML = num2;
            document.getElementById("plusresult").innerHTML = plus;

            document.getElementById("a2").innerHTML = num1;
            document.getElementById("b2").innerHTML = num2;
            document.getElementById("minusresult").innerHTML = minus;
        }
    </script>
</head>

<body>
    <h3>Aritmatika</h3>

    Angka Pertama:
    <input type="text" id="1number"><br><br>

    Angka Kedua:
    <input type="text" id="2number"><br><br>

    <button onclick="count()">Count</button>

    <br>
    <br>

    <table border="1" cellpadding="50">
        <tr>
            <td id="a1"></td>
            <td>+</td>
            <td id="b1"></td>
            <td>=</td>
            <td id="plusresult"></td>
        </tr>

        <tr>
            <td id="a2"></td>
            <td>-</td>
            <td id="b2"></td>
            <td>=</td>
            <td id="minusresult"></td>
        </tr>
    </table>
</body>

</html>
