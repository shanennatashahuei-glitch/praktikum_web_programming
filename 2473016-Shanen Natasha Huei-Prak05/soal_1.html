<html lang="en">
<head>
    <title>Gambar Bintang Hover-2473016</title>
    <style>
    table {
        margin: auto;
    }

    .box {
        position: relative;
        width: 200px;
        height: 200px;
    }

    .box img {
        width: 120px;
        position: absolute;
        top: 40px;
        left: 40px;
    }

    .corner {
        width: 30px;
        height: 30px;
        position: absolute;
        border: 5px solid #FF0000;
    }

    .topleft {
        top: 0;
        left: 0;
        border-right: none;
        border-bottom: none;
    }

    .topright {
        top: 0;
        right: 0;
        border-left: none;
        border-bottom: none;
    }

    .bottomleft {
        bottom: 0;
        left: 0;
        border-right: none;
        border-top: none;
    }

    .bottomright {
        bottom: 0;
        right: 0;
        border-left: none;
        border-top: none;
    }


    .box:hover .corner {
        border-color: #FF00FF;
    }

    </style>
</head>
    <body>
        <table>
            <tr>
            <td>
            <a href="#">
                <div class="box">
            
                    <img src="src/star.jpg">
                    <div class="corner topleft"></div>
                    <div class="corner topright"></div>
                    <div class="corner bottomleft"></div>
                    <div class="corner bottomright"></div>
            
                </div>
            </a>
            </td>
            </tr>
        </table>            
    </body>
</html>
