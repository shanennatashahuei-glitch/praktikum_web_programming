<html>
    <head>
        <title>Form3</title>
    </head>
<body>
    <h1>Form Tambah Data User</h1>
    <form>
    <table>
        <tr>
            <td>Name:</td>
            <td>
            <input type="text" name="name" required
            oninvalid="this.setCustomValidity('Name is required!!!')"
            oninput="this.setCustomValidity('')">
            </td>
        </tr>

        <tr>
            <td>Address:</td>
            <td>
            <input type="text" name="address" required
            oninvalid="this.setCustomValidity('Address is required!!!')"
            oninput="this.setCustomValidity('')">
            </td>
        </tr>

        <tr>
            <td>Email:</td>
            <td>
            <input type="email" name="email" required
            oninvalid="this.setCustomValidity(this.value.includes('@') ? '' : 'Sertakan @ pada alamat email ini. ' + this.value + ' tidak memiliki @')"
            oninput="this.setCustomValidity('')">
            </td>
        </tr>

        <tr>
            <td>Home Page:</td>
            <td>
            <input type="url" name="homepage">
            </td>
        </tr>

        <tr>
            <td>Birthday:</td>
            <td>
            <input type="date" name="bday">
            </td>
        </tr>

        <tr>
            <td>Favorit Color:</td>
            <td>
            <input type="color" name="favcolor">
            </td>
        </tr>

        <tr>
            <td>IPK:</td>
            <td>
            <input type="number" name="ipk" min="0" max="4" step="0.1" value="0">
            </td>
        </tr>

        <tr>
            <td>Phone Number:</td>
            <td>
            <input type="text" name="phone"
            pattern="[0-9]{3}-[0-9]{7,10}"
            title="Format: ###-#######">
            </td>
        </tr>

        <tr>
            <td></td>
            <td></td>
            <td>
            <input type="submit" value="Add">
            </td>
        </tr>

    </table>
    </form>
</body>
</html>
