<html>
    <head>
        <title>Form2</title>
    </head>
<body>
    <form action="proses.html">
    <table border="solid 2px">
        <tr colspan>
            <td colspan="2" style="text-align: center;background-color: gray; color:white;" >Personal Data</td>
        </tr>
        <tr>
            <td>
                <table>
                        <tr>
                            <td>Nama</td>
                            <td><input type="text"></td>
                        </tr>

                        <tr>
                            <td>Alamat</td>
                            <td><textarea name="" id=""></textarea></td>
                        </tr>

                        <tr>
                            <td>Jenis Kelamin </td>
                            <td>
                            <input id="lk" type="radio" name="kelamin" value="pria">
                            <label for="lk">Laki-laki</label>
                            <br>
                                
                            <input id="pr" type="radio" name="kelamin" value="wanita">
                            <label for="pr">Perempuan</label>
                            </td>
                        </tr>

                        <tr>
                            <td>Tanggal Lahir</td>
                            <td>
                                <select name="tanggal">
                                    <option>1</option>
                                    <option>2</option>
                                    <option>3</option>
                                    <option>4</option>
                                </select>
                                -
                                <select name="bulan">
                                    <option>Januari</option>
                                    <option>Februari</option>
                                    <option>Maret</option>
                                    <option>April</option>
                                </select>
                                -
                                <select name="tahun">
                                    <option>2003</option>
                                    <option>2002</option>
                                    <option>2001</option>
                                    <option>2000</option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td>Jurusan</td>
                            <td>
                                <select name="jurusan" size="4">
                                    <option>Teknik Informatika</option>
                                    <option>Sistem Informasi</option>
                                    <option>Teknik Elektro</option>
                                    <option>Teknik Sipil</option>
                                    <option>Sistem Komputer</option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2">
                                <fieldset>
                                    <legend>Hobi</legend>
                        
                                    <table width="100%">
                                        <tr>
                                            <td>
                                                <input type="checkbox" name="hobi" value="membaca"> Membaca<br>
                                                <input type="checkbox" name="hobi" value="menulis"> Menulis<br>
                                                <input type="checkbox" name="hobi" value="catur"> Catur
                                            </td>
                        
                                            <td>
                                                <input type="checkbox" name="hobi" value="voli"> Voli<br>
                                                <input type="checkbox" name="hobi" value="badminton"> Badminton<br>
                                                <input type="checkbox" name="hobi" value="golf"> Golf
                                            </td>
                                        </tr>
                                    </table>
                                </fieldset>
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2">
                                <hr>
                            </td>
                        </tr>

                        <tr>
                            <td></td>
                            <td align="right">
                                <br>
                            <input type="submit" value="Submit">
                            </td>
                        </tr>



                </table>
        </table>
    </table>
    </form>
</body>
</html>
